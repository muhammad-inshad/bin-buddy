<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="binFriendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Shadow for glyph depth -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#052e16" flood-opacity="0.25"/>
    </filter>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Rounded Container -->
  <circle cx="256" cy="256" r="236" fill="url(#binFriendGrad)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#86efac" stroke-width="6" opacity="0.4"/>

  <!-- Logo Icon Glyph Group -->
  <g filter="url(#glyphShadow)" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dustbin Lid Handle -->
    <path d="M 220 135 L 292 135" stroke-width="18"/>
    
    <!-- Dustbin Lid -->
    <rect x="146" y="155" width="220" height="28" rx="14" fill="#ffffff" stroke="none"/>

    <!-- Dustbin Body -->
    <path d="M 172 205 L 188 375 C 190 398 208 415 231 415 L 281 415 C 304 415 322 398 324 375 L 340 205 Z" 
          fill="none" stroke="#ffffff" stroke-width="22"/>

    <!-- Vertical Rib lines on Bin Body -->
    <line x1="226" y1="235" x2="232" y2="385" stroke="#ffffff" stroke-width="12" opacity="0.9"/>
    <line x1="286" y1="235" x2="280" y2="385" stroke="#ffffff" stroke-width="12" opacity="0.9"/>

    <!-- Eco Leaf / Sprout inside the bin -->
    <path d="M 256 340 C 256 280 295 245 320 240 C 320 270 295 325 256 340 Z" 
          fill="url(#leafGrad)" stroke="#16a34a" stroke-width="4"/>
    <path d="M 256 340 C 256 295 230 265 210 260 C 210 285 228 325 256 340 Z" 
          fill="url(#leafGrad)" stroke="#16a34a" stroke-width="4"/>
    <line x1="256" y1="340" x2="256" y2="285" stroke="#16a34a" stroke-width="6"/>
  </g>
</svg>