<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="abGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="abShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#064e3b" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#abBg)"/>
  
  <!-- Subtle circular eco waves -->
  <circle cx="680" cy="120" r="160" fill="#22c55e" fill-opacity="0.08"/>
  <circle cx="120" cy="500" r="140" fill="#0284c7" fill-opacity="0.06"/>

  <!-- City Skyline / Green Neighborhood Silhouette -->
  <g opacity="0.3" fill="#94a3b8">
    <rect x="80" y="240" width="70" height="180" rx="3"/>
    <rect x="160" y="200" width="90" height="220" rx="3"/>
    <rect x="260" y="270" width="80" height="150" rx="3"/>
    <rect x="520" y="220" width="85" height="200" rx="3"/>
    <rect x="620" y="250" width="90" height="170" rx="3"/>
  </g>

  <!-- Green Earth / Park ground curve -->
  <path d="M 0 420 Q 400 360 800 420 L 800 600 L 0 600 Z" fill="#dcfce7"/>
  <path d="M 0 460 Q 400 410 800 460 L 800 600 L 0 600 Z" fill="#bbf7d0"/>

  <!-- Electric Green Bin Buddy Van -->
  <g transform="translate(220, 260)" filter="url(#abShadow)">
    <!-- Van Body -->
    <path d="M 20 140 L 20 30 Q 20 15 35 15 L 240 15 Q 260 15 280 40 L 320 85 Q 330 95 330 115 L 330 140 Z" fill="url(#abGreen)"/>
    <!-- Windows -->
    <path d="M 245 28 L 275 28 L 310 80 L 245 80 Z" fill="#38bdf8" fill-opacity="0.9"/>
    <rect x="160" y="28" width="75" height="52" rx="4" fill="#38bdf8" fill-opacity="0.75"/>
    <rect x="75" y="28" width="75" height="52" rx="4" fill="#38bdf8" fill-opacity="0.75"/>
    
    <!-- Van Logo / Brand Text -->
    <circle cx="100" cy="105" r="18" fill="#ffffff"/>
    <path d="M 94 105 L 100 99 L 106 105 M 100 100 L 100 112" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <text x="130" y="110" font-family="system-ui, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="1">BIN BUDDY</text>
    <text x="130" y="125" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#bbf7d0">100% ELECTRIC ECO LOGISTICS</text>

    <!-- Wheels -->
    <circle cx="85" cy="145" r="26" fill="#1e293b"/>
    <circle cx="85" cy="145" r="14" fill="#94a3b8"/>
    <circle cx="85" cy="145" r="6" fill="#475569"/>

    <circle cx="275" cy="145" r="26" fill="#1e293b"/>
    <circle cx="275" cy="145" r="14" fill="#94a3b8"/>
    <circle cx="275" cy="145" r="6" fill="#475569"/>

    <!-- Headlight -->
    <polygon points="325,105 330,105 330,118 325,118" fill="#fef08a"/>
  </g>

  <!-- Happy Community Residents & Recycling Partner -->
  <g transform="translate(110, 310)" filter="url(#abShadow)">
    <circle cx="30" cy="25" r="14" fill="#fbcfe8"/>
    <path d="M 15 42 Q 30 38 45 42 L 48 85 L 12 85 Z" fill="#0284c7"/>
    <rect x="18" y="85" width="8" height="40" fill="#1e293b"/>
    <rect x="34" y="85" width="8" height="40" fill="#1e293b"/>
    <!-- Holding small green home bin -->
    <rect x="42" y="48" width="22" height="28" rx="3" fill="#16a34a"/>
  </g>

  <g transform="translate(590, 290)" filter="url(#abShadow)">
    <!-- Worker with thumbs up -->
    <circle cx="30" cy="25" r="14" fill="#fcd34d"/>
    <path d="M 18 20 Q 30 8 42 20 L 46 22 L 14 22 Z" fill="#15803d"/>
    <path d="M 15 42 Q 30 38 45 42 L 48 85 L 12 85 Z" fill="#166534"/>
    <rect x="18" y="85" width="8" height="40" fill="#1e293b"/>
    <rect x="34" y="85" width="8" height="40" fill="#1e293b"/>
    <!-- Neon Vest -->
    <rect x="22" y="44" width="16" height="35" fill="#facc15"/>
  </g>

  <!-- Big Floating Mission Pill -->
  <g transform="translate(230, 60)" filter="url(#abShadow)">
    <rect width="340" height="70" rx="35" fill="#ffffff"/>
    <circle cx="45" cy="35" r="24" fill="#dcfce7"/>
    <text x="45" y="43" font-size="24" text-anchor="middle">🌍</text>
    <text x="85" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#14532d">Clean Homes. Cleaner Planet.</text>
    <text x="85" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#64748b">Serving 4,500+ households with care</text>
  </g>
</svg>
