<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="50%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle decorative circles -->
  <circle cx="700" cy="90" r="140" fill="#22c55e" fill-opacity="0.08"/>
  <circle cx="120" cy="110" r="80" fill="#0284c7" fill-opacity="0.06"/>
  <path d="M0 380 Q 200 360, 400 375 T 800 370 L 800 500 L 0 500 Z" fill="#e2e8f0" fill-opacity="0.5"/>
  <rect x="0" y="390" width="800" height="110" fill="url(#roadGrad)"/>
  <line x1="0" y1="445" x2="800" y2="445" stroke="#ffffff" stroke-width="4" stroke-dasharray="24 16"/>

  <!-- Truck and Haulage Group -->
  <g filter="url(#shadow)">
    <!-- Flatbed truck cargo bed -->
    <rect x="180" y="240" width="310" height="110" rx="6" fill="#334155"/>
    <rect x="185" y="245" width="300" height="15" fill="#475569"/>
    
    <!-- Items in truck: Sofa, boxes, appliance -->
    <!-- Large old sofa -->
    <g transform="translate(195, 175)">
      <!-- Cushions / Backrest -->
      <rect x="0" y="15" width="130" height="55" rx="8" fill="url(#sofaGrad)"/>
      <rect x="5" y="40" width="120" height="30" rx="6" fill="#f97316"/>
      <!-- Armrests -->
      <rect x="-6" y="28" width="16" height="42" rx="6" fill="#c2410c"/>
      <rect x="120" y="28" width="16" height="42" rx="6" fill="#c2410c"/>
      <!-- Pillows -->
      <circle cx="35" cy="45" r="10" fill="#fed7aa"/>
      <circle cx="95" cy="45" r="10" fill="#fed7aa"/>
    </g>

    <!-- Discarded Refrigerator / Appliance -->
    <g transform="translate(345, 160)">
      <rect x="0" y="0" width="65" height="100" rx="4" fill="#94a3b8"/>
      <rect x="3" y="3" width="59" height="32" rx="3" fill="#cbd5e1"/>
      <rect x="3" y="38" width="59" height="59" rx="3" fill="#e2e8f0"/>
      <!-- Handles -->
      <rect x="8" y="15" width="3" height="14" rx="1.5" fill="#475569"/>
      <rect x="8" y="48" width="3" height="24" rx="1.5" fill="#475569"/>
    </g>

    <!-- Cardboard Moving / Junk boxes -->
    <g transform="translate(420, 200)">
      <polygon points="0,25 35,5 75,25 40,45" fill="#d97706"/>
      <polygon points="0,25 40,45 40,85 0,65" fill="#b45309"/>
      <polygon points="75,25 40,45 40,85 75,65" fill="#92400e"/>
      <line x1="30" y1="20" x2="45" y2="28" stroke="#fef3c7" stroke-width="2"/>
    </g>

    <!-- Truck Cab -->
    <g transform="translate(490, 190)">
      <path d="M 0 160 L 0 50 Q 0 40 10 35 L 70 15 Q 90 10 105 30 L 135 75 Q 145 90 145 110 L 145 160 Z" fill="url(#truckBody)"/>
      <!-- Windshield & Window -->
      <path d="M 72 24 L 20 40 L 20 85 L 85 85 L 115 75 Z" fill="#38bdf8" fill-opacity="0.85"/>
      <!-- Door outline -->
      <path d="M 15 95 L 85 95 L 85 155 L 15 155 Z" fill="none" stroke="#14532d" stroke-width="2"/>
      <rect x="25" y="105" width="12" height="4" rx="2" fill="#e2e8f0"/>
      <!-- Headlight -->
      <polygon points="140,115 145,115 145,130 140,130" fill="#fde047"/>
      <!-- Grille -->
      <rect x="130" y="135" width="15" height="15" fill="#1e293b"/>
      <rect x="110" y="150" width="35" height="10" rx="3" fill="#475569"/>
    </g>

    <!-- Truck Wheels -->
    <g>
      <!-- Rear wheel 1 -->
      <circle cx="230" cy="390" r="32" fill="#1e293b"/>
      <circle cx="230" cy="390" r="18" fill="#94a3b8"/>
      <circle cx="230" cy="390" r="8" fill="#475569"/>
      <!-- Rear wheel 2 -->
      <circle cx="310" cy="390" r="32" fill="#1e293b"/>
      <circle cx="310" cy="390" r="18" fill="#94a3b8"/>
      <circle cx="310" cy="390" r="8" fill="#475569"/>
      <!-- Front wheel -->
      <circle cx="580" cy="390" r="32" fill="#1e293b"/>
      <circle cx="580" cy="390" r="18" fill="#94a3b8"/>
      <circle cx="580" cy="390" r="8" fill="#475569"/>
    </g>
  </g>

  <!-- Friendly worker carrying carton / checkmark badge -->
  <g transform="translate(68, 230)" filter="url(#shadow)">
    <!-- Worker silhouette / figure -->
    <circle cx="45" cy="30" r="16" fill="#15803d"/>
    <!-- Safety cap -->
    <path d="M 27 28 Q 45 10 63 28 L 68 30 L 22 30 Z" fill="#22c55e"/>
    <!-- Body -->
    <path d="M 28 50 L 62 50 L 58 110 L 32 110 Z" fill="#166534"/>
    <!-- Legs -->
    <rect x="33" y="110" width="10" height="50" rx="3" fill="#1e293b"/>
    <rect x="47" y="110" width="10" height="50" rx="3" fill="#1e293b"/>
    <!-- Safety vest stripes -->
    <rect x="36" y="55" width="18" height="40" fill="#facc15" fill-opacity="0.8"/>
    <!-- Holding heavy duty box -->
    <rect x="52" y="50" width="45" height="40" rx="4" fill="#d97706"/>
    <line x1="52" y1="70" x2="97" y2="70" stroke="#b45309" stroke-width="2"/>
  </g>

  <!-- Eco Junk Badge floating -->
  <g transform="translate(560, 50)" filter="url(#shadow)">
    <rect width="180" height="56" rx="28" fill="#ffffff"/>
    <circle cx="30" cy="28" r="18" fill="#dcfce7"/>
    <path d="M 22 28 L 28 34 L 38 22" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="60" y="27" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#14532d">Bulk Removal</text>
    <text x="60" y="43" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Responsible hauling</text>
  </g>
</svg>
