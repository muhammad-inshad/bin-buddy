<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="officeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glassWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="metalBin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="greenStation" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="blueStation" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="yellowStation" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#officeBg)"/>

  <!-- Modern Office Architectural Background -->
  <g opacity="0.45">
    <!-- Tall windows / skyscrapers silhouette -->
    <rect x="80" y="60" width="130" height="300" fill="#cbd5e1" rx="4"/>
    <rect x="230" y="30" width="160" height="330" fill="#94a3b8" rx="4"/>
    <rect x="410" y="90" width="120" height="270" fill="#cbd5e1" rx="4"/>
    <!-- Window grid patterns -->
    <g fill="#f8fafc" opacity="0.7">
      <rect x="95" y="80" width="20" height="35" rx="2"/>
      <rect x="125" y="80" width="20" height="35" rx="2"/>
      <rect x="155" y="80" width="20" height="35" rx="2"/>
      <rect x="95" y="130" width="20" height="35" rx="2"/>
      <rect x="125" y="130" width="20" height="35" rx="2"/>
      <rect x="155" y="130" width="20" height="35" rx="2"/>
      
      <rect x="250" y="55" width="25" height="40" rx="2"/>
      <rect x="290" y="55" width="25" height="40" rx="2"/>
      <rect x="330" y="55" width="25" height="40" rx="2"/>
      <rect x="250" y="115" width="25" height="40" rx="2"/>
      <rect x="290" y="115" width="25" height="40" rx="2"/>
      <rect x="330" y="115" width="25" height="40" rx="2"/>
    </g>
  </g>

  <!-- Office Floor -->
  <rect x="0" y="360" width="800" height="140" fill="#f1f5f9"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Floor perspective lines -->
  <line x1="0" y1="420" x2="800" y2="420" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Potted Office Plant (Fiddle Leaf / Eco vibe) -->
  <g transform="translate(90, 240)">
    <!-- Pot -->
    <polygon points="15,120 45,120 52,70 8,70" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Plant Leaves -->
    <ellipse cx="30" cy="50" rx="14" ry="24" fill="#15803d" transform="rotate(-20 30 50)"/>
    <ellipse cx="30" cy="30" rx="16" ry="28" fill="#16a34a" transform="rotate(15 30 30)"/>
    <ellipse cx="45" cy="40" rx="15" ry="25" fill="#22c55e" transform="rotate(35 45 40)"/>
    <ellipse cx="15" cy="45" rx="15" ry="25" fill="#15803d" transform="rotate(-35 15 45)"/>
  </g>

  <!-- Central Triple Commercial Waste Sorting Station -->
  <g transform="translate(230, 160)" filter="url(#cardShadow)">
    <!-- Base Cabinet Station -->
    <rect x="0" y="60" width="360" height="150" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    
    <!-- Bin Compartment 1: Paper / Blue -->
    <g transform="translate(20, 20)">
      <!-- Top lid bevel -->
      <path d="M 10 40 L 80 40 L 85 55 L 5 55 Z" fill="#bae6fd"/>
      <!-- Slot for paper -->
      <rect x="25" y="44" width="40" height="6" rx="3" fill="#0369a1"/>
      <!-- Bin Front Body -->
      <rect x="5" y="55" width="80" height="120" rx="10" fill="url(#blueStation)"/>
      <!-- Paper Icon -->
      <rect x="35" y="85" width="20" height="26" rx="2" fill="#ffffff" fill-opacity="0.9"/>
      <line x1="40" y1="93" x2="50" y2="93" stroke="#0284c7" stroke-width="2"/>
      <line x1="40" y1="99" x2="50" y2="99" stroke="#0284c7" stroke-width="2"/>
      <text x="45" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PAPER</text>
    </g>

    <!-- Bin Compartment 2: Recyclables / Green -->
    <g transform="translate(135, 10)">
      <!-- Top lid bevel -->
      <path d="M 10 50 L 80 50 L 85 65 L 5 65 Z" fill="#bbf7d0"/>
      <!-- Circular opening for bottles -->
      <circle cx="45" cy="57" r="6" fill="#15803d"/>
      <!-- Bin Front Body -->
      <rect x="5" y="65" width="80" height="120" rx="10" fill="url(#greenStation)"/>
      <!-- Recycle loop icon -->
      <circle cx="45" cy="100" r="14" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="16 10"/>
      <text x="45" y="150" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">RECYCLE</text>
    </g>

    <!-- Bin Compartment 3: General / Yellow -->
    <g transform="translate(250, 20)">
      <!-- Top lid bevel -->
      <path d="M 10 40 L 80 40 L 85 55 L 5 55 Z" fill="#fef08a"/>
      <!-- Rectangular push flap -->
      <rect x="25" y="44" width="40" height="8" rx="2" fill="#a16207"/>
      <!-- Bin Front Body -->
      <rect x="5" y="55" width="80" height="120" rx="10" fill="url(#yellowStation)"/>
      <!-- General Waste Icon -->
      <polygon points="35,88 55,88 52,108 38,108" fill="#ffffff" fill-opacity="0.9"/>
      <line x1="33" y1="86" x2="57" y2="86" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <text x="45" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">GENERAL</text>
    </g>
  </g>

  <!-- Commercial Plan Floating Badge -->
  <g transform="translate(560, 70)" filter="url(#cardShadow)">
    <rect width="190" height="64" rx="18" fill="#ffffff"/>
    <rect x="14" y="14" width="36" height="36" rx="10" fill="#dcfce7"/>
    <path d="M 24 32 L 30 38 L 40 26" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <text x="60" y="32" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Commercial Plans</text>
    <text x="60" y="48" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748b">Offices &amp; Retailers</text>
  </g>
</svg>
